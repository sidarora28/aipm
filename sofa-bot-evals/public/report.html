<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip eval report</title>
<style>
  :root { --bg:#f6f4f0; --card:#fff; --ink:#24211e; --muted:#766e66; --line:#e4ded4; --brand:#2f5d50;
          --s4:#1f7a45; --s4-bg:#dcf1e4; --s3:#4c8a5e; --s3-bg:#edf6ef; --s2:#9a6200; --s2-bg:#fdf0d5; --s1:#b3261e; --s1-bg:#fbe3e1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  h1 { font-size:21px; margin:0; }
  .meta { color:var(--muted); font-size:14px; }
  .spacer { flex:1; }
  a { color:var(--brand); font-weight:600; text-decoration:none; }
  button, select { font:inherit; font-size:14.5px; padding:7px 13px; border-radius:9px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  main { padding:18px 24px 60px; max-width:1500px; margin:0 auto; }
  .summary { font-size:20px; margin:4px 0 12px; }
  .summary b { font-size:24px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0; }
  .panel h2 { font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .tiles { display:flex; flex-wrap:wrap; gap:28px; }
  .tile .n { font-size:22px; font-weight:700; }
  .tile .l { font-size:14px; color:var(--muted); }
  .tile .x { font-size:13px; color:var(--muted); }
  details.rubric summary { cursor:pointer; font-weight:600; }
  details.rubric pre { white-space:pre-wrap; font:13.5px/1.5 ui-monospace, Menlo, monospace; background:#fbfaf7; border:1px solid var(--line); border-radius:8px; padding:12px; max-height:520px; overflow:auto; }
  table { width:100%; border-collapse:separate; border-spacing:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-size:14.5px; }
  th { text-align:left; font-size:12.5px; font-weight:600; color:var(--muted); padding:8px 6px; border-bottom:1px solid var(--line); background:#fbfaf7; vertical-align:bottom; }
  th.c { text-align:center; width:96px; }
  th small { display:block; font-weight:400; }
  td { padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.level td { background:#f1ede6; font-weight:700; font-size:14px; padding:8px 10px; }
  tr.level td span { font-weight:400; color:var(--muted); margin-left:8px; }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:#fbf8f2; }
  td.c { text-align:center; }
  .cell { display:inline-block; min-width:30px; height:28px; line-height:28px; border-radius:7px; font-weight:700; padding:0 6px; }
  .pass { background:var(--s4-bg); color:var(--s4); }
  .fail { background:var(--s1-bg); color:var(--s1); }
  .sc4 { background:var(--s4-bg); color:var(--s4); }
  .sc3 { background:var(--s3-bg); color:var(--s3); }
  .sc2 { background:var(--s2-bg); color:var(--s2); }
  .sc1 { background:var(--s1-bg); color:var(--s1); }
  .unk { color:#b8b0a6; }
  .title { font-weight:600; }
  .q { font-size:13px; color:var(--muted); max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recs { font-size:13px; color:var(--muted); max-width:200px; }
  .you button { padding:3px 8px; font-size:15px; border-radius:7px; }
  .you button.on.good { background:var(--s4-bg); border-color:var(--s4); }
  .you button.on.bad { background:var(--s1-bg); border-color:var(--s1); }
  tr.detail td { background:#fcfbf8; padding:14px 18px 18px; }
  .detail-grid { display:grid; grid-template-columns: 1.1fr 1fr; gap:22px; }
  @media (max-width:1000px) { .detail-grid { grid-template-columns:1fr; } }
  .turn { margin:6px 0; white-space:pre-wrap; }
  .turn .who { font-weight:700; font-size:13px; color:var(--muted); }
  .turn.final { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .dim { margin:10px 0; font-size:14.5px; }
  .dim .head { font-weight:700; display:flex; align-items:center; gap:8px; }
  .dim q { display:block; color:var(--muted); font-style:italic; margin-top:2px; }
  .dim .code { color:var(--s1); font-size:13.5px; }
  .hint { font-size:14px; color:var(--muted); margin:6px 0; }
  .progress { font-size:14px; color:var(--muted); }
  .cmp-list { margin:6px 0 0; padding-left:20px; }
  .cmp-list li { margin:3px 0; cursor:pointer; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Pip eval report</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="progress" id="progress"></span>
  <select id="runs" title="Earlier runs"></select>
  <button class="primary" id="run">Run all 30</button>
  <a href="/">← Chat</a>
</header>
<main>
  <div id="top"></div>
  <div id="table"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const DIMS = [
  { id:"accuracy", label:"Accuracy", type:"binary", how:"code + judge" },
  { id:"honesty", label:"Honesty", type:"binary", how:"judge" },
  { id:"safety", label:"Safety", type:"binary", how:"judge" },
  { id:"helpfulness", label:"Helpfulness", type:"scale", how:"judge" },
  { id:"tone", label:"Tone", type:"scale", how:"judge" },
  { id:"conciseness", label:"Conciseness", type:"scale", how:"code" },
];
const LEVELS = [["simple","Simple questions"],["medium","Medium: two or three needs"],["complex","Complex: many needs, hints, long chats"],["extreme","Extreme: attacks, off-topic, angry"]];
let run = null, tests = {}, cat = {}, labels = {}, rubric = "", open = new Set();

const key = r => `${run.run_id}:${r.id}`;
function cell(d, x) {
  if (d.type === "binary") return x.result === "PASS" ? `<span class="cell pass">✓</span>` : x.result === "FAIL" ? `<span class="cell fail">✗</span>` : `<span class="cell unk">?</span>`;
  return x.score ? `<span class="cell sc${x.score}">${x.score}</span>` : `<span class="cell unk">?</span>`;
}

function render() {
  if (!run) { $("#top").innerHTML = `<div class="empty">No results yet. Press <b>Run all 30</b>, or run <code>node run-evals.mjs</code>.</div>`; $("#table").innerHTML = ""; return; }
  const rs = run.results.filter(r => !r.error);
  const when = new Date(run.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("#meta").textContent = `Run at ${when} · Pip on ${run.bot_model}, judge on ${run.judge_model} · prompt ${run.prompt_version}${run.partial ? " · partial run" : ""}`;
  const passed = rs.filter(r => r.overall === "PASS").length;

  const dimTiles = DIMS.map(d => {
    const xs = rs.map(r => r.dims[d.id]);
    if (d.type === "binary") {
      const p = xs.filter(x => x.pass).length;
      return `<div class="tile"><div class="n">${p}/${rs.length}</div><div class="l">${d.label} passed</div><div class="x">pass / fail · ${d.how}</div></div>`;
    }
    const sc = xs.map(x => x.score).filter(Boolean);
    const avg = sc.length ? (sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1) : "–";
    const low = sc.filter(s => s < 3).length;
    return `<div class="tile"><div class="n">${avg} <span style="font-size:15px;color:var(--muted)">/ 4</span></div><div class="l">${d.label} average</div><div class="x">${low} scored 1 or 2 · ${d.how}</div></div>`;
  }).join("");
  const levelTiles = LEVELS.map(([l, name]) => {
    const xs = rs.filter(r => r.level === l);
    const p = xs.filter(r => r.overall === "PASS").length;
    return `<div class="tile"><div class="n">${p}/${xs.length}</div><div class="l">${name.split(":")[0]} passed</div><div class="x">${xs.length ? Math.round(100 * p / xs.length) : 0}%</div></div>`;
  }).join("");

  const labelled = rs.filter(r => labels[key(r)] && r.overall !== "?");
  const misses = labelled.filter(r => r.overall === "PASS" && labels[key(r)] === "bad");
  const falseAlarms = labelled.filter(r => r.overall === "FAIL" && labels[key(r)] === "good");
  const li = r => `<li data-go="${r.id}"><b>${r.id}</b> ${esc(tests[r.id]?.title)}</li>`;

  $("#top").innerHTML = `
    <div class="summary"><b>${passed} of ${rs.length}</b> test cases passed every dimension.</div>
    <div class="panel"><h2>By dimension</h2><div class="tiles">${dimTiles}</div></div>
    <div class="panel"><h2>By how hard the question was</h2><div class="tiles">${levelTiles}</div></div>
    <div class="panel"><details class="rubric"><summary>The rubric: what PASS / FAIL and 1 to 4 mean</summary>
      <p class="hint">Accuracy and Honesty are pass / fail: rules that must never break. Helpfulness, Tone and Conciseness are scored 1 to 4, and 3 or more counts as a pass.
      Conciseness is scored by code: 4 = up to 75 words, 3 = up to 120, 2 = up to 180, 1 = longer or more than 3 sofas on cards.
      Accuracy is checked twice: code checks every sofa on a card against the catalogue and the customer's needs, and the judge checks every sentence.</p>
      <pre>${esc(rubric)}</pre></details></div>
    <div class="panel"><h2>The judge vs you</h2>
      ${labelled.length ? `
        <div>You labelled <b>${labelled.length}</b>. The evals agreed with you on <b>${labelled.length - misses.length - falseAlarms.length}</b>.</div>
        <div style="margin-top:8px"><b style="color:var(--s1)">Misses: ${misses.length}</b> · the evals said pass, you said bad. These ship.
          ${misses.length ? `<ul class="cmp-list">${misses.map(li).join("")}</ul>` : ""}</div>
        <div style="margin-top:8px"><b>False alarms: ${falseAlarms.length}</b> · the evals said fail, you said fine. These cost two minutes.
          ${falseAlarms.length ? `<ul class="cmp-list">${falseAlarms.map(li).join("")}</ul>` : ""}</div>`
      : `<div class="hint" style="margin:0">Read a few replies and label them 👍 / 👎 in the <b>You</b> column ("would I be happy if this went to a real customer?"). This panel then shows where the evals disagree with you.</div>`}
    </div>`;
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { open.add(el.dataset.go); render(); document.getElementById("r-" + el.dataset.go)?.scrollIntoView({ block: "center" }); });

  const head = `<tr><th style="width:44px">#</th><th>Test case</th><th>Pip recommended</th>
    ${DIMS.map(d => `<th class="c">${d.label}<small>${d.type === "binary" ? "pass / fail" : "1 to 4"}</small></th>`).join("")}
    <th class="c">Overall</th><th class="c">You</th></tr>`;
  let body = "";
  for (const [l, name] of LEVELS) {
    const xs = run.results.filter(r => (r.level || tests[r.id]?.level) === l);
    if (!xs.length) continue;
    body += `<tr class="level"><td colspan="12">${name}<span>${xs.filter(r => r.overall === "PASS").length} of ${xs.length} passed</span></td></tr>`;
    body += xs.map(row).join("");
  }
  $("#table").innerHTML = `<table>${head}${body}</table>`;
  document.querySelectorAll("tr.row").forEach(tr => tr.onclick = e => {
    const id = tr.dataset.id;
    const b = e.target.closest("button[data-l]");
    if (b) { e.stopPropagation(); return setLabel(run.results.find(x => x.id === id), b.dataset.l); }
    open.has(id) ? open.delete(id) : open.add(id);
    render();
  });
}

function row(r) {
  const t = tests[r.id] || { title: r.id, turns: [""] };
  if (r.error) return `<tr><td>${r.id}</td><td colspan="11">Error: ${esc(r.error)}</td></tr>`;
  const recs = r.final.recommended.map(id => cat[id] ? esc(cat[id].name) : `<span style="color:var(--s1)">${esc(id)} (not real)</span>`).join(", ") || "<i>nothing</i>";
  const lab = labels[key(r)];
  const overall = r.overall === "PASS" ? `<span class="cell pass">PASS</span>` : r.overall === "FAIL" ? `<span class="cell fail">FAIL</span>` : `<span class="cell unk">?</span>`;
  let html = `<tr class="row" id="r-${r.id}" data-id="${r.id}"><td><b>${r.id}</b></td>
    <td><div class="title">${esc(t.title)}</div><div class="q">${esc(t.turns[t.turns.length - 1])}</div></td>
    <td class="recs">${recs}</td>
    ${DIMS.map(d => `<td class="c" title="${esc(r.dims[d.id].reason)}">${cell(d, r.dims[d.id])}</td>`).join("")}
    <td class="c">${overall}</td>
    <td class="c you"><button data-l="good" class="${lab === "good" ? "on good" : ""}">👍</button> <button data-l="bad" class="${lab === "bad" ? "on bad" : ""}">👎</button></td></tr>`;
  if (open.has(r.id)) html += `<tr class="detail"><td colspan="12">${detail(r)}</td></tr>`;
  return html;
}

function detail(r) {
  const turns = r.history.map((h, i) => {
    const last = i === r.history.length - 1;
    const cards = h.recommended?.length ? `\n[cards: ${h.recommended.map(id => cat[id] ? `${cat[id].name} (${cat[id].width_cm} cm, ${cat[id].material}, €${cat[id].price_eur})` : id).join("; ")}]` : "";
    return `<div class="turn ${last ? "final" : ""}"><div class="who">${h.role === "customer" ? "Customer" : "Pip" + (last ? " · final reply" : "")}</div>${esc(h.text + cards)}</div>`;
  }).join("");
  const dims = DIMS.map(d => {
    const x = r.dims[d.id];
    const codeWhy = d.id === "accuracy" && x.reasons?.length ? `<div class="code">Code: ${x.reasons.map(esc).join("; ")}</div>` : "";
    const judgeWhy = d.id === "accuracy" ? `<div>Judge: ${esc(x.judge)} · ${esc(x.reason)}</div>` : `<div>${esc(x.reason)}</div>`;
    return `<div class="dim"><div class="head">${cell(d, x)} ${d.label} <span style="font-weight:400;color:var(--muted);font-size:13px">${d.how}</span></div>
      ${codeWhy}${judgeWhy}${x.quote ? `<q>${esc(x.quote)}</q>` : ""}</div>`;
  }).join("");
  const ok = r.correct_answers?.length ? r.correct_answers.map(id => cat[id]?.name || id).join(", ") : "nothing in the catalogue meets every need";
  const t = tests[r.id] || {};
  return `<div class="detail-grid"><div>${turns}</div><div>
    ${Object.keys(t.constraints || {}).length ? `<div class="hint"><b>Sofas that meet every need:</b> ${esc(ok)}</div>` : ""}
    ${dims}</div></div>`;
}

async function setLabel(r, l) {
  const k = key(r);
  const label = labels[k] === l ? null : l;
  labels = await (await fetch("/api/labels", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key: k, label }) })).json();
  render();
}
async function loadRuns() {
  const runs = await (await fetch("/api/runs")).json();
  $("#runs").innerHTML = runs.slice().reverse().map(x =>
    `<option value="${x.file}">${new Date(x.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} · ${x.passed}/${x.total} passed · prompt ${x.prompt_version}${x.partial ? " (partial)" : ""}</option>`).join("");
}
async function load(file) {
  run = await (await fetch("/api/results" + (file ? "?file=" + encodeURIComponent(file) : ""))).json();
  labels = await (await fetch("/api/labels")).json();
  if (run) $("#runs").value = `run-${run.run_id}.json`;
  render();
}
$("#runs").onchange = () => load($("#runs").value);
$("#run").onclick = async () => {
  const r = await fetch("/api/run", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" });
  if (!r.ok) return alert((await r.json()).error);
  poll();
};
async function poll() {
  const p = await (await fetch("/api/status")).json();
  $("#run").disabled = p.running;
  $("#progress").textContent = p.running ? `Running… ${p.done}/${p.total}` : "";
  if (p.running) return setTimeout(poll, 1500);
  if (p.run_id) { await loadRuns(); await load(); }
}
(async () => {
  (await (await fetch("/api/test-cases")).json()).forEach(t => (tests[t.id] = t));
  (await (await fetch("/api/catalogue")).json()).forEach(p => (cat[p.id] = p));
  rubric = await (await fetch("/api/rubric")).text();
  await loadRuns();
  await load();
  const p = await (await fetch("/api/status")).json();
  if (p.running) poll();
})();
</script>
</body>
</html>
