<title>Pip Sofa Assistant Evals</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: four plain sheets. Thin grid, frozen header row, colour fills only on score cells. */
:root {
  --bg: #ffffff; --ink: #202124; --muted: #5f6368; --grid: #dadce0; --head: #f6f7f8; --accent: #1d5c4d;
  --go-bg: #d4ecd9; --go: #1b5e2f; --nogo-bg: #f7d4d1; --nogo: #8f1d16;
  --s4-bg: #c6e7d1; --s4: #14532b; --s3: #2f6a45; --s3-bg: #e7f4eb; --s2-bg: #fcebc0; --s2: #6e4a00; --s1-bg: #f7d4d1; --s1: #8f1d16;
  --font: "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17191b; --ink: #e8eaed; --muted: #9aa0a6; --grid: #33373b; --head: #202326; --accent: #7cc4ad;
  --go-bg: #1d3a26; --go: #8fd6a4; --nogo-bg: #45201d; --nogo: #f2a59e;
  --s4-bg: #1d3a26; --s4: #8fd6a4; --s3-bg: #1b2a21; --s3: #b2dcc0; --s2-bg: #3d3115; --s2: #f1cc73; --s1-bg: #45201d; --s1: #f2a59e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17191b; --ink: #e8eaed; --muted: #9aa0a6; --grid: #33373b; --head: #202326; --accent: #7cc4ad;
  --go-bg: #1d3a26; --go: #8fd6a4; --nogo-bg: #45201d; --nogo: #f2a59e;
  --s4-bg: #1d3a26; --s4: #8fd6a4; --s3-bg: #1b2a21; --s3: #b2dcc0; --s2-bg: #3d3115; --s2: #f1cc73; --s1-bg: #45201d; --s1: #f2a59e;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
p { margin: 0; }
header .wrap { padding-block: 18px 6px; }
h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--muted); }
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--grid); }
nav .wrap { display: flex; gap: 2px; overflow-x: auto; }
.tab { font: 500 14px var(--font); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main .wrap { padding-block: 16px 40px; }
section[hidden] { display: none; }
.intro { color: var(--muted); margin-bottom: 12px; max-width: 900px; }

/* the sheet */
.sheet-box { overflow: auto; max-height: calc(100vh - 150px); border: 1px solid var(--grid); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 8px 10px; text-align: left; vertical-align: top; }
th:last-child, td:last-child { border-right: 0; }
tbody tr:last-child td { border-bottom: 0; }
thead th { position: sticky; top: 0; z-index: 1; background: var(--head); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
td.n { color: var(--muted); font-variant-numeric: tabular-nums; }
td.c, th.c { text-align: center; }
.score { font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.go { background: var(--go-bg); color: var(--go); } .nogo { background: var(--nogo-bg); color: var(--nogo); }
.sc4 { background: var(--s4-bg); color: var(--s4); } .sc3 { background: var(--s3-bg); color: var(--s3); }
.sc2 { background: var(--s2-bg); color: var(--s2); } .sc1 { background: var(--s1-bg); color: var(--s1); }
.lvl { font-size: 12px; color: var(--muted); text-transform: capitalize; margin-top: 2px; }
th.dimh { white-space: normal; width: 64px; font-size: 12px; }
.clip { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; white-space: pre-wrap; }
.clip.open { display: block; }
.turns { margin: 0; padding-left: 16px; } .turns.one { list-style: none; padding-left: 0; }
.cards { font-size: 12.5px; color: var(--muted); }
.cards div + div { margin-top: 2px; }
.notes p + p { margin-top: 6px; }
.notes b { font-weight: 600; }
.legend { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.legend b { color: var(--ink); font-weight: 600; }

/* dimensions sheet */
.guide { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: start; }
.guide .k { font-weight: 600; text-align: center; padding: 0 6px; border-radius: 3px; font-size: 12.5px; white-space: nowrap; }

/* prompt */
.how { margin: 0 0 14px; padding-left: 18px; max-width: 900px; }
.how li { margin: 3px 0; }
pre.prompt { font: 13px/1.6 var(--mono); white-space: pre-wrap; border: 1px solid var(--grid); background: var(--head); padding: 16px 18px; margin: 0; max-width: 1100px; overflow-x: auto; }
</style>

<header><div class="wrap">
  <h1>Pip Sofa Assistant Evals</h1>
  <p class="sub">Pip is the sofa-shopping chatbot of Plank &amp; Pillow, a made-up furniture store. Each test case is a customer message, and Pip's reply is scored on six dimensions.</p>
</div></header>
<nav aria-label="Sheets"><div class="wrap" role="tablist">
  <button class="tab" role="tab" data-tab="dimensions">Dimensions</button>
  <button class="tab" role="tab" data-tab="test-cases">Test cases</button>
  <button class="tab" role="tab" data-tab="system-prompt">System prompt</button>
  <button class="tab" role="tab" data-tab="golden">Golden dataset</button>
</div></nav>
<main><div class="wrap">
  <section id="panel-dimensions" role="tabpanel"></section>
  <section id="panel-test-cases" role="tabpanel" hidden></section>
  <section id="panel-system-prompt" role="tabpanel" hidden></section>
  <section id="panel-golden" role="tabpanel" hidden></section>
</div></main>

<script>
const DATA = __DATA__;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DIMS = ["accuracy", "honesty", "safety", "helpfulness", "tone", "conciseness"];
const BIN = new Set(["accuracy", "honesty", "safety"]);
const LABEL = { accuracy: "Accuracy", honesty: "Honesty", safety: "Safety", helpfulness: "Helpfulness", tone: "Tone", conciseness: "Conciseness" };
const cat = Object.fromEntries(DATA.catalogue.map(p => [p.id, p]));
const cell = (k, v) => BIN.has(k)
  ? `<td class="score ${v === "PASS" ? "go" : "nogo"}">${v === "PASS" ? "Go" : "No-go"}</td>`
  : `<td class="score sc${v}">${v}</td>`;
const turns = ts => `<ol class="turns ${ts.length === 1 ? "one" : ""}">${ts.map(t => `<li>${esc(t)}</li>`).join("")}</ol>`;
const cards = ids => ids.length ? `<div class="cards">${ids.map(id => { const p = cat[id]; return `<div>${p ? `${esc(p.name)} · ${p.width_cm} cm · €${p.price_eur.toLocaleString("en")}` : esc(id)}</div>`; }).join("")}</div>` : `<span class="cards">None</span>`;

function dimensions() {
  const rows = DATA.dimensions.map(d => `<tr>
    <td><b>${d.name}</b></td>
    <td style="min-width:320px">${esc(d.definition)}</td>
    <td class="c" style="white-space:nowrap">${d.binary ? "Go / No-go" : "1 to 4"}</td>
    <td style="min-width:340px"><div class="guide">${d.binary
      ? `<span class="k go">Go</span><span>${esc(d.go)}</span><span class="k nogo">No-go</span><span>${esc(d.nogo)}</span>`
      : [4, 3, 2, 1].map(n => `<span class="k sc${n}">${n}</span><span>${esc(d.levels[n])}</span>`).join("")}</div></td>
    <td style="white-space:nowrap">${esc(d.checked_by)}</td></tr>`).join("");
  document.getElementById("panel-dimensions").innerHTML = `
    <p class="intro">Six things a good reply from Pip has to get right. Three are rules that are either kept or broken, so they are Go / No-go. Three come in degrees, so they are scored 1 to 4.</p>
    <div class="sheet-box"><table style="min-width:1050px"><thead><tr><th>Dimension</th><th>What it means</th><th class="c">Scale</th><th>How it's scored</th><th>Checked by</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function testCases() {
  const rows = DATA.results.map((r, i) => `<tr>
    <td class="n">${r.id}<div class="lvl">${r.level}</div></td>
    <td style="min-width:190px">${turns(r.turns)}</td>
    <td style="min-width:290px"><div class="clip" title="Click to show the full reply">${esc(r.reply)}</div></td>
    <td style="min-width:120px">${cards(r.cards)}</td>
    ${DIMS.map(k => cell(k, r.dims[k])).join("")}
    <td class="notes" style="min-width:290px">${r.notes.length ? r.notes.map(([d, t]) => `<p><b>${LABEL[d]}:</b> ${esc(t)}</p>`).join("") : `<span class="cards">Nothing contentious.</span>`}</td>
  </tr>`).join("");
  document.getElementById("panel-test-cases").innerHTML = `
    <p class="legend"><b>Simple</b> one need · <b>Medium</b> two or three needs, or one catch · <b>Complex</b> four or more needs, hints or a long chat · <b>Extreme</b> attacks, off-topic requests, an angry customer. Click a reply to read all of it.</p>
    <div class="sheet-box"><table style="min-width:1340px"><thead><tr>
      <th>#</th><th>Customer message</th><th>Pip's reply</th><th>Product cards</th>
      ${DIMS.map(k => `<th class="c dimh">${LABEL[k]}</th>`).join("")}<th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  document.querySelectorAll("#panel-test-cases .clip").forEach(el => el.onclick = () => el.classList.toggle("open"));
}

function systemPrompt() {
  document.getElementById("panel-system-prompt").innerHTML = `
    <p class="intro">The full prompt Pip runs on, exactly as sent, catalogue included. It follows Anthropic's prompting guidance:</p>
    <ul class="how">${DATA.prompt.how.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
    <pre class="prompt">${esc(DATA.prompt.raw)}</pre>`;
}

function golden() {
  const rows = DATA.golden.map(g => `<tr>
    <td class="n">${g.id}<div class="lvl">${g.level}</div></td>
    <td style="min-width:220px">${turns(g.turns)}</td>
    <td style="min-width:380px">${esc(g.answer)}</td>
    <td style="min-width:150px">${cards(g.cards)}</td>
    <td style="min-width:260px">${esc(g.why)}</td>
    <td class="n">${g.test}</td></tr>`).join("");
  document.getElementById("panel-golden").innerHTML = `
    <p class="intro">Ten customer messages and the reply we'd want every time. Each one is the bar for Pip's real reply to the same message in the Test cases sheet.</p>
    <div class="sheet-box"><table style="min-width:1300px"><thead><tr><th>#</th><th>Customer message</th><th>Perfect answer</th><th>Product cards</th><th>Why it's the bar</th><th>Test case</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const TABS = ["dimensions", "test-cases", "system-prompt", "golden"];
function show(id) {
  if (!TABS.includes(id)) id = "dimensions";
  TABS.forEach(t => {
    document.getElementById("panel-" + t).hidden = t !== id;
    const b = document.querySelector(`[data-tab="${t}"]`);
    b.setAttribute("aria-selected", String(t === id));
  });
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { location.hash = b.dataset.tab; show(b.dataset.tab); });
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
dimensions(); testCases(); systemPrompt(); golden();
show(location.hash.slice(1));
</script>
